<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Registration</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #198754 0%, #20c997 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px 0; box-sizing: border-box; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #198754; text-align: center; font-size: 26px; }
        p { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="password"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        input[type="file"] { width: 100%; padding: 8px 0; font-size: 13px; }
        .btn-success { background: #198754; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-success:hover { background: #157347; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .links a { color: #198754; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👨‍⚕️ Doctor Registration</h2>
        <p>Join our AI Telemedicine network to consult patients</p>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Doctor Username</label>
                <input type="text" name="username" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required placeholder="doctor@hospital.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="specialization">Medical Specialization</label>
                <input type="text" name="specialization" id="specialization" required placeholder="e.g., Cardiologist, General Physician">
            </div>
            <div class="form-group">
                <label for="experience">Experience (Years)</label>
                <input type="number" name="experience" id="experience" required placeholder="e.g., 5">
            </div>
            <div class="form-group">
                <label for="available_time">Available Consultation Time</label>
                <input type="text" name="available_time" id="available_time" required placeholder="e.g., 9:00 AM - 1:00 PM">
            </div>
            <div class="form-group">
                <label for="image">Profile Photo (Image)</label>
                <input type="file" name="image" id="image" accept="image/*">
            </div>
            
            <button type="submit" class="btn-success">Register Profile 🚀</button>
        </form>

        <div class="links">
            Already registered? <a href="{% url 'doctor_login' %}">Doctor Login</a><br><br>
            <a href="/" style="color:#666; font-weight:normal;">← Back to Home</a>
        </div>
    </div>

</body>
</html>
