<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Login</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 380px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #0d6efd; text-align: center; font-size: 26px; }
        p { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn-primary { background: #0d6efd; color: rgb(199, 11, 152); border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-primary:hover { background: #0b5ed7; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .links a { color: #0d6efd; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔑 Patient Login</h2>
        <p>Access your AI Telemedicine Dashboard</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn-primary">Sign In 🔓</button>
        </form>

        <div class="links">
            New here? <a href="{% url 'register' %}">Create Account</a><br><br>
            <a href="/" style="color:#666; font-weight:normal;">← Back to Home</a>
        </div>
    </div>

</body>
</html>
