<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #0d6efd; text-align: center; font-size: 26px; }
        p { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        input[type="file"] { width: 100%; padding: 8px 0; font-size: 13px; }
        .btn-primary { background: #0d6efd; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-primary:hover { background: #0b5ed7; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .links a { color: #0d6efd; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🤢 Patient Sign Up</h2>
        <p>Create an account to analyze symptoms with AI</p>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="image">Profile Photo (Image)</label>
                <input type="file" name="image" id="image" accept="image/*">
            </div>
            
            <button type="submit" class="btn-primary">Create Account 🚀</button>
        </form>

        <div class="links">
            Already a patient? <a href="{% url 'login' %}">Login</a>
        </div>
    </div>

</body>
</html>
